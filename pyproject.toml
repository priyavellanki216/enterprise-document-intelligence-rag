[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-document-intelligence-rag"
version = "0.1.0"
description = "A citation-grounded engineering and OT document retrieval service"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "starlette==1.10.0",
  "uvicorn[standard]==0.34.2",
  "qdrant-client[fastembed]==1.20.0",
  "fastembed==0.9.1",
  "pypdf==6.21.3",
  "python-docx==1.1.2",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.4",
  "sqlalchemy==2.0.41",
  "httpx==0.28.1",
  "pillow==13.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]==3.2.9"]
test = ["pytest==9.2.0", "httpx==0.28.1", "httpx2==2.16.0", "ruff==0.11.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
